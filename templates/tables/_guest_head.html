{# Shared head for the guest pages: night palette for rooftops and bars. #}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#10291f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #10291f; --deck: #173b2d; --deck-2: #1f4838; --line: #2f5a49;
    --ink: #eef3ee; --muted: #a3b8ad; --brass: #d3a768; --brass-ink: #2a1d0b;
    --free: #5fbf8c; --few: #e3ae4b; --full: #4f5f58; --err: #f0a09a;
    --serif: "Bodoni Moda", Georgia, serif; --sans: "Hanken Grotesk", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--night); color: var(--ink); font: 16px/1.5 var(--sans); }
  a { color: var(--brass); }
  button, input { font: inherit; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 22px 16px 140px; }
  .venue { font-family: var(--serif); font-weight: 500; font-size: clamp(2rem, 9vw, 2.8rem); line-height: 1.05; margin: 4px 0 6px; letter-spacing: -.01em; }
  .lede { color: var(--muted); margin: 0; font-size: .95rem; }
  .foot { color: #6f887b; font-size: .78rem; text-align: center; margin-top: 34px; }
  .foot a { color: #8fa79a; text-decoration: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
