<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Verzio Studio{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>

  <div class="app-shell">

    <div class="sidebar-scrim"></div>

    <!-- ==================== SIDEBAR ==================== -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">V</div>
        <span class="sidebar-brand-text">Verzio Studio</span>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-title">Overview</div>

        <a href="/admin" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
          <i class="bi bi-grid-1x2"></i>
          <span class="nav-label">Dashboard</span>
        </a>

        <div class="sidebar-section-title">Operations</div>

        <a href="/admin/appointments" class="nav-item {% if active_page == 'appointments' %}active{% endif %}">
          <i class="bi bi-calendar-check"></i>
          <span class="nav-label">Appointments</span>
          <span class="nav-item-badge">12</span>
        </a>

        <a href="/admin/businesses" class="nav-item {% if active_page == 'businesses' %}active{% endif %}">
          <i class="bi bi-building"></i>
          <span class="nav-label">Businesses</span>
        </a>

        <a href="/admin/services" class="nav-item {% if active_page == 'services' %}active{% endif %}">
          <i class="bi bi-scissors"></i>
          <span class="nav-label">Services</span>
        </a>

        <div class="sidebar-section-title">Configuration</div>

        <a href="/admin/settings" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
          <i class="bi bi-sliders"></i>
          <span class="nav-label">Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="#" class="sidebar-tenant">
          <div class="sidebar-tenant-avatar">VP</div>
          <div class="sidebar-tenant-detail">
            <div class="sidebar-tenant-name">Verzio Parallel Salon</div>
            <div class="sidebar-tenant-sub">Asia/Kolkata</div>
          </div>
        </a>
      </div>
    </aside>

    <!-- ==================== MAIN COLUMN ==================== -->
    <div class="main-col">

      <!-- ---- Topbar ---- -->
      <header class="topbar">
        <button class="sidebar-toggle-btn d-none d-lg-flex" data-action="toggle-sidebar" aria-label="Collapse sidebar">
          <i class="bi bi-layout-sidebar"></i>
        </button>
        <button class="sidebar-toggle-btn d-flex d-lg-none" data-action="toggle-sidebar-mobile" aria-label="Open menu">
          <i class="bi bi-list" style="font-size: 20px;"></i>
        </button>

        <div class="topbar-search">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Search bookings, customers, businesses…">
          <kbd>⌘K</kbd>
        </div>

        <div class="topbar-right">
          <button class="icon-btn" aria-label="Notifications">
            <i class="bi bi-bell"></i>
            <span class="dot"></span>
          </button>
          <button class="icon-btn" aria-label="Help">
            <i class="bi bi-question-circle"></i>
          </button>
          <div class="topbar-avatar">RA</div>
        </div>
      </header>

      <!-- ---- Page content ---- -->
      <main class="page-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', path='js/script.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
