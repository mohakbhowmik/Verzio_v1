{% extends "owner_base_mobile.html" %}

{% block title %}{% if service %}Edit Service{% else %}Add Service{% endif %} — Verzio Studio{% endblock %}

{% block content %}
<section class="owner-mobile-page">
    <div class="mb-3">
        <div class="text-uppercase small fw-bold text-muted">Services</div>
        <h1 class="h4 fw-bold mb-1">{% if service %}Edit Service{% else %}Add Service{% endif %}</h1>
        <p class="text-muted small mb-0">Configure your booking catalog.</p>
    </div>

    <form method="post" action="{{ form_action }}" class="owner-mobile-card p-3">
        <label class="small text-muted">Service name</label>
        <input type="text" name="name" class="form-control mt-2" required value="{{ service.name if service else '' }}">
        <label class="small text-muted mt-3">Duration (mins)</label>
        <input type="number" name="duration" class="form-control mt-2" value="{{ service.duration if service else 30 }}">
        <label class="small text-muted mt-3">Price</label>
        <input type="number" name="price" class="form-control mt-2" value="{{ service.price if service and service.price is not none else '' }}">
        <div class="form-check form-switch mt-3">
            <input class="form-check-input" type="checkbox" name="is_active" {% if (service.is_active if service else true) %}checked{% endif %}>
            <label class="form-check-label">Service is active</label>
        </div>
        <div class="d-flex gap-2 mt-3">
            <a href="/owner/services" class="btn btn-outline-secondary flex-grow-1">Cancel</a>
            <button type="submit" class="btn btn-primary flex-grow-1">Save</button>
        </div>
    </form>
</section>
{% endblock %}
