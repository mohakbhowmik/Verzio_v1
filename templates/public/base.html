<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Verzio Studio{% endblock %}</title>
<meta name="description" content="Verzio Studio: WhatsApp booking for salons, spas and clinics. Customers book on your own WhatsApp number, day and night.">
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f5f1; --card: #ffffff; --ink: #14211c; --muted: #5a6a63; --line: #d6ddd8;
    --accent: #1c4a3d; --accent-ink: #ffffff; --accent-soft: #e3ece6; --deep: #12352c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.65 "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  .wrap { max-width: 880px; margin: 0 auto; padding-inline: 20px; }
  header.site { padding-block: 18px; background: var(--deep); }
  header.site nav a { color: #b9c9c0; }
  header.site nav a:hover { color: #fff; }
  header.site .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { font-family: "Gilda Display", Georgia, serif; font-size: 1.5rem; color: #f2f5f1; text-decoration: none; }
  .brand span { color: #c9a25a; }
  nav a { margin-left: 16px; color: var(--muted); text-decoration: none; font-size: .92rem; }
  nav a:hover { color: var(--ink); }
  main { padding-block: 40px 56px; }
  h1 { font-family: "Gilda Display", Georgia, serif; font-weight: 400; font-size: clamp(2.2rem, 5vw, 3.2rem); line-height: 1.1; margin: 0 0 12px; text-wrap: balance; }
  h2 { font-size: 1.2rem; margin: 34px 0 8px; }
  p, li { max-width: 68ch; }
  .muted { color: var(--muted); }
  footer.site { border-top: 1px solid var(--line); padding-block: 24px; font-size: .88rem; color: var(--muted); }
  footer.site .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  footer.site a { color: var(--muted); margin-right: 14px; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="site"><div class="wrap">
  <a class="brand" href="/">Verzio<span>.</span></a>
  <nav><a href="/#how">How it works</a><a href="/#pricing">Pricing</a><a href="/owner/login">Owner login</a></nav>
</div></header>
<main><div class="wrap">{% block content %}{% endblock %}</div></main>
<footer class="site"><div class="wrap">
  <div><a href="/privacy">Privacy policy</a><a href="/terms">Terms of service</a></div>
  <div>© 2026 Verzio Studio · Mohak Bhowmik · +91 82628 58396</div>
</div></footer>
</body>
</html>
