<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173b32">

    <title>{% block title %}Verzio Studio{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">

    {% block extra_head %}{% endblock %}
</head>

<body class="auth-body">

    <div class="auth-mobile-brand">
        <span class="sidebar-brand">
            <span class="brand-mark">V</span>
            <span class="brand-word">Verzio<small>Studio</small></span>
        </span>
    </div>

    <div class="auth-split">

        <aside class="auth-panel">
            <span class="sidebar-brand">
                <span class="brand-mark">V</span>
                <span class="brand-word">Verzio<small>Studio</small></span>
            </span>

            <div>
                <p class="auth-quote">Every chair filled. Every booking on WhatsApp.</p>
                <p class="auth-quote-sub">Appointments, approvals and your day's numbers for salons, spas and clinics, in one place.</p>
            </div>

            <div class="auth-panel-foot">Owner portal</div>
        </aside>

        <main class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-form">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </main>

    </div>

</body>
</html>
