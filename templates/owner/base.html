<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Verzio Studio{% endblock %}</title>

    <!-- Bootstrap 5 (Utility & Grid only) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Fonts: Inter for readability, JetBrains Mono for ID/Phone data -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <!-- Design System: White Background / Thin Borders / Accent Only -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">

    {% block extra_head %}{% endblock %}
</head>
<body>

    <div class="app-shell">

        <!-- ==================== SIDEBAR ==================== -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                Verzio Studio
            </div>

            <nav class="sidebar-nav">
                <a href="/owner" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
                    <i class="bi bi-compass"></i>
                    <span>Overview</span>
                </a>

                <a href="/owner/appointments" class="nav-item {% if active_page == 'appointments' %}active{% endif %}">
                    <i class="bi bi-calendar3"></i>
                    <span>Appointments</span>
                </a>

                <a href="/owner/services" class="nav-item {% if active_page == 'services' %}active{% endif %}">
                    <i class="bi bi-briefcase"></i>
                    <span>Services</span>
                </a>

                <a href="/owner/reports" class="nav-item {% if active_page == 'reports' %}active{% endif %}">
                    <i class="bi bi-bar-chart"></i>
                    <span>Reports</span>
                </a>

                <a href="/owner/settings" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
                    <i class="bi bi-gear"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>

        <!-- ==================== MAIN COLUMN ==================== -->
        <div class="main-col">

            <!-- ---- Top Bar ---- -->
            <header class="topbar">
                <div class="topbar-left">
                    <h1 class="page-current-title">{% block page_title %}Overview{% endblock %}</h1>
                </div>

                <div class="topbar-center">
                    <div class="topbar-search">
                        <i class="bi bi-search"></i>
                        <input type="text" placeholder="Search data...">
                    </div>
                </div>

                <div class="topbar-right">
                    <details class="profile-menu">
                        <summary class="profile-trigger">
                            <span class="mono">OWNER</span>
                            <i class="bi bi-chevron-down"></i>
                        </summary>

                        <div class="profile-dropdown">
                            <form action="/owner/logout" method="post">
                                <button type="submit" class="dropdown-item">
                                    <i class="bi bi-box-arrow-right"></i>
                                    Logout
                                </button>
                            </form>
                        </div>
                    </details>
                </div>
            </header>

            <!-- ---- Main Content Area ---- -->
            <main class="content-container">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Minimum Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', path='js/script.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
