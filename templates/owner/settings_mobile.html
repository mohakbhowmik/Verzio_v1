{% extends "owner_base_mobile.html" %}

{% block title %}Settings — Verzio Studio{% endblock %}

{% block content %}
<section class="owner-mobile-page">
    <div class="mb-3">
        <div class="text-uppercase small fw-bold text-muted">Settings</div>
        <h1 class="h4 fw-bold mb-1">Studio Configuration</h1>
        <p class="text-muted small mb-0">Adjust booking controls and business details.</p>
    </div>

    {% if message %}
    <div class="alert alert-success py-2 mb-3">{{ message }}</div>
    {% endif %}

    <form method="post" action="/owner/settings">
        <div class="owner-mobile-card p-3 mb-3">
            <label class="small text-muted">Business name</label>
            <input type="text" class="form-control mt-2" name="business_name" value="{{ business.name }}">
            <label class="small text-muted mt-3">Public phone</label>
            <input type="text" class="form-control mt-2" name="phone_number" value="{{ business.manager_phone_number }}">
            <label class="small text-muted mt-3">Timezone</label>
            <select class="form-select mt-2" name="timezone">
                <option value="Asia/Kolkata" {% if business.timezone == 'Asia/Kolkata' %}selected{% endif %}>Asia/Kolkata</option>
                <option value="UTC" {% if business.timezone == 'UTC' %}selected{% endif %}>UTC</option>
            </select>
        </div>

        <div class="owner-mobile-card p-3 mb-3">
            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" name="accept_online_bookings" {% if business.accepting_bookings %}checked{% endif %}>
                <label class="form-check-label">Accept online bookings</label>
            </div>
            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" name="require_owner_approval" {% if business.approval_mode == 'manual' %}checked{% endif %}>
                <label class="form-check-label">Manual approval mode</label>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" name="show_services_during_booking" {% if business.enable_service_selection %}checked{% endif %}>
                <label class="form-check-label">Show service selection</label>
            </div>
        </div>

        <div class="owner-mobile-card p-3">
            <button type="submit" class="btn btn-primary w-100">Save Changes</button>
        </div>
    </form>
</section>
{% endblock %}
