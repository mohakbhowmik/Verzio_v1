{% extends "owner/auth_base.html" %}

{% block title %}Owner Login{% endblock %}

{% block content %}

<h2 class="text-center mb-4">
    Welcome Back
</h2>

<p class="text-center text-muted mb-4">
    Sign in to continue to Verzio Studio
</p>

{% if error %}
<div class="alert alert-danger">
    {{ error }}
</div>
{% endif %}

<form method="post">

    <div class="mb-3">
        <label class="form-label">
            Email or Phone
        </label>

        <input
            type="text"
            name="identifier"
            class="form-control-verzio"
            placeholder="Enter your email or phone"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">
            Password
        </label>

        <input
            type="password"
            name="password"
            class="form-control-verzio"
            placeholder="Enter your password"
            required>
    </div>

    <div class="form-check mb-4">
        <input
            class="form-check-input"
            type="checkbox"
            id="remember"
            name="remember_me">

        <label
            class="form-check-label"
            for="remember">

            Remember me

        </label>
    </div>

    <button
        type="submit"
        class="btn-verzio-primary w-100">

        Sign In

    </button>

</form>

{% endblock %}
