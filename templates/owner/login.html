{% extends "owner/auth_base.html" %}

{% block title %}Sign in — Verzio Studio{% endblock %}

{% block content %}

<div class="auth-brand">
    <h1>Welcome back</h1>
    <p>Sign in to manage today's bookings.</p>
</div>

{% if error %}
<div class="alert alert-danger d-flex align-items-start gap-2" role="alert">
    <i class="bi bi-exclamation-circle mt-1"></i>
    <span>{{ error }}</span>
</div>
{% endif %}

<form method="post">

    <div class="mb-3">
        <label class="form-label" for="identifier">Email or phone</label>
        <input
            type="text"
            id="identifier"
            name="identifier"
            class="form-control-verzio"
            placeholder="you@yourstudio.com"
            autocomplete="username"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            class="form-control-verzio"
            autocomplete="current-password"
            required>
    </div>

    <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="remember" name="remember_me">
        <label class="form-check-label" for="remember">Keep me signed in</label>
    </div>

    <button type="submit" class="btn-verzio-primary w-100">Sign in</button>

</form>

{% endblock %}
