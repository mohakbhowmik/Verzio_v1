services:
  app:
    build: .
    container_name: verzio_saas
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - verzio_sqlite_data:/app/data
    expose:
      - "8000"

  caddy:
    image: caddy:latest
    container_name: verzio_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  verzio_sqlite_data:
  caddy_data:
  caddy_config:
