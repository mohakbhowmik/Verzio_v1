services:
  app:
    build: .
    container_name: verzio_saas
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides .env: the database must live on the persistent volume,
      # or every rebuild starts with an empty database.
      - DATABASE_URL=sqlite:////app/data/verzio_saas.db
    volumes:
      - verzio_sqlite_data:/app/data
    expose:
      - "8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:latest
    container_name: verzio_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  verzio_sqlite_data:
  caddy_data:
  caddy_config:
